<html lang="fr">
<head>

<style>
:root{--bg:#f5f7f7;--card:#fff;--ink:#1b2a2a;--muted:#647373;--accent:#0f766e;--line:#dde5e5;--done:#16a34a;--bad:#dc2626;--warn:#b45309;--fluo-ok:#5dff6b;--fluo-ko:#ff5c5c;--on-accent:#fff;--head:#0f766e}
@media (prefers-color-scheme: dark){:root{--bg:#0f1716;--card:#172321;--ink:#e6f0ef;--muted:#9bb0ae;--accent:#2dd4bf;--line:#263a38;--done:#4ade80;--bad:#f87171;--warn:#fbbf24;--on-accent:#04231f;--head:#115e59}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--head);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none;font-size:1.3rem;padding:4px 8px;border-radius:8px}
header h1{font-size:1.05rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:1.1rem;margin:0 0 6px} h3{font-size:1rem;margin:0 0 6px}
p{margin:6px 0}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-link{display:block;color:inherit;text-decoration:none}
.small{font-size:.85rem;color:var(--muted)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--done);width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pct{font-weight:700;color:var(--accent);white-space:nowrap}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0;white-space:nowrap}
.badge.read{border-color:var(--done);color:var(--done)}
.badge.ok{background:var(--fluo-ok);color:#000;border-color:transparent}
.badge.ko{background:var(--fluo-ko);color:#000;border-color:transparent}
.badge.skip{color:var(--warn);border-color:var(--warn)}
.sub{border-top:1px solid var(--line);padding:10px 0}
.item{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.92rem;cursor:pointer}
.item input{width:20px;height:20px;margin-top:1px;accent-color:var(--done);flex-shrink:0}
.course{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.course>a{flex:1;color:inherit;text-decoration:none;min-width:0}
button.mini{padding:4px 9px;font-size:.8rem;border-radius:8px}
button,.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);color:var(--on-accent)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.tabs{display:flex;gap:6px;margin:10px 0 4px}
.tabs button{flex:1;padding:8px 6px}
input[type=range]{accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=text],input[type=password],textarea,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label.field{display:block;margin:10px 0 4px;font-weight:600;font-size:.92rem}
.text{white-space:pre-wrap;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:1rem;overflow-wrap:anywhere;max-height:60vh;overflow-y:auto}
mark.ok{background:var(--fluo-ok);color:#000;border-radius:3px}
mark.ko{background:var(--fluo-ko);color:#000;border-radius:3px}
.legend span{display:inline-block;padding:2px 8px;border-radius:4px;color:#000;margin-left:6px;font-size:.8rem}
.hidden{display:none}
.qtext{font-size:1.05rem;font-weight:600;line-height:1.5}
.verdict-ok{color:var(--done);font-weight:700}
.verdict-ko{color:var(--bad);font-weight:700}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg{font-size:.9rem;color:var(--muted);margin-top:8px;min-height:1.2em}
.err{color:var(--bad)}
</style>

<body>
<header>
  <a href="#/" aria-label="Accueil">⌂</a>
  <h1 id="title">Révision Kiné</h1>
  <a href="#/reglages" aria-label="Réglages">⚙</a>
</header>
<main id="app"></main>

<script>
"use strict";
// ================= Données de référence =================
const DEADLINE = new Date("2027-02-01T00:00:00");
const DOMAINS = [
  { id:"respi", name:"Respiratoire", subs:["Général","Pathologies obstructives (BPCO, asthme)","Pathologies restrictives","Post-opératoire / soins intensifs","Ventilation"] },
  { id:"otr", name:"OTR (orthopédie, traumatologie)", subs:["Poignet - main","Coude - avant-bras","Épaule - bras","Hanche - cuisse","Genou - jambe","Cheville - pied"] },
  { id:"sport", name:"Sport", subs:["Poignet - main","Coude - avant-bras","Épaule - bras","Hanche - cuisse","Genou - jambe","Cheville - pied"] },
  { id:"geria", name:"Gériatrie", subs:["Général","Chutes et équilibre","Troubles cognitifs","Fragilité / sarcopénie","Post-chirurgie orthopédique","Pathologies neurologiques du sujet âgé"] },
  { id:"neuro", name:"Neurologie", subs:["Général","IMC","Cérébelleux","Extra-pyramidal","Sclérose en plaques","Pyramidal","Périphériques"] }
];
const STEPS = [
  "Anatomie & biomécanique (os, muscles, nerfs, ligaments, vaisseaux)",
  "Tests & bilan",
  "Anamnèse & objectifs de traitement",
  "Plan de traitement & exercices"
];
const STEP_KEY = "kine-revision-v1"; // même clé que la v1 : la progression des étapes est conservée
const SET_KEY = "kine-settings";
const MODEL = "claude-sonnet-5-5";

// ================= Utilitaires =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const domOf = id => DOMAINS.find(d => d.id === id);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const lsGet = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const getSettings = () => lsGet(SET_KEY, {});
let STEPS_DONE = lsGet(STEP_KEY, {});
const TABS = {}; // onglet affiché par pathologie : « cours » ou « cas »
let FLASH = null; // message ponctuel { text, hash } : affiché une seule fois, sur la page visée
const flash = (text, hash = location.hash || "#/") => { FLASH = { text, hash }; };
const takeFlash = () => {
  if (!FLASH || FLASH.hash !== (location.hash || "#/")) return "";
  const t = FLASH.text; FLASH = null; return t;
};
let BUSY = false; // une génération est en cours
let COURSES = [];
let QZ = null; // état de l'interrogation en cours

// ================= Base de données (IndexedDB : gère les gros textes) =================
const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open("kine-revision-db", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("courses", { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("courses", mode);
      const req = fn(t.objectStore("courses"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => run("readonly", s => s.getAll()),
    put: c => run("readwrite", s => s.put(c)),
    del: id => run("readwrite", s => s.delete(id)),
    putMany: list => run("readwrite", s => { list.forEach(c => s.put(c)); return null; })
  };
})();

// ================= Calculs =================
function qStats(c) {
  const total = c.questions.length;
  const asked = c.questions.filter(q => q.status).length;
  const ok = c.questions.filter(q => q.status === "correct").length;
  const ko = c.questions.filter(q => q.status === "wrong").length;
  const sk = c.questions.filter(q => q.status === "skipped").length;
  let label;
  if (!total) label = "Pas de questions";
  else if (!asked) label = "Pas encore interrogée";
  else if (asked === total) label = "Interrogée intégralement";
  else label = `Interrogée à ${pct(asked, total)} %`;
  return { total, asked, ok, ko, sk, label };
}
const stepKey = (d, s, i) => `${d}|${s}|${i}`;
function domStats(d) {
  const total = d.subs.length * STEPS.length;
  let done = 0;
  d.subs.forEach(s => STEPS.forEach((_, i) => { if (STEPS_DONE[stepKey(d.id, s, i)]) done++; }));
  const courses = COURSES.filter(c => c.domain === d.id);
  let qt = 0, qa = 0;
  courses.forEach(c => { const st = qStats(c); qt += st.total; qa += st.asked; });
  return { done, total, pct: pct(done, total), courses: courses.length, reads: courses.filter(c => c.read).length, qt, qa, know: knowAvg(courses) };
}
// connaissance moyenne (0-100) des cours évalués ; null si aucun n'est évalué
function knowAvg(list) {
  const ev = list.filter(c => c.knowledge != null);
  return ev.length ? { avg: Math.round(ev.reduce((a, c) => a + c.knowledge, 0) / ev.length), n: ev.length } : null;
}
const knowLabel = (k, total) => k ? `connaissance moyenne ${k.avg}/100 (${k.n}/${total} évalué${k.n > 1 ? "s" : ""})` : "connaissance non évaluée";
const getCourse = id => COURSES.find(c => c.id === id);
const routeParts = () => (location.hash || "#/").replace(/^#\/?/, "").split("/").map(decodeURIComponent);

// ================= Surlignage du texte =================
// Version « normalisée » d'un texte : lettres et chiffres seulement, sans accents, en minuscules.
// map[i] = position dans le texte d'origine du i-ème caractère normalisé.
function normalize(text) {
  let norm = "";
  const map = [];
  for (let i = 0; i < text.length; i++) {
    let ch = text[i];
    if (ch === "œ" || ch === "Œ") ch = "oe";
    else if (ch === "æ" || ch === "Æ") ch = "ae";
    else if (ch === "ß") ch = "ss";
    const base = ch.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
    for (const b of base) if (/[a-z0-9]/.test(b) || (b > "\u007f" && /\p{L}|\p{N}/u.test(b))) { norm += b; map.push(i); }
  }
  return { norm, map };
}
const NORM_CACHE = new Map(); // id du cours -> { text, n }
function normFor(c) {
  const hit = NORM_CACHE.get(c.id);
  if (hit && hit.text === c.text) return hit.n;
  const n = normalize(c.text);
  NORM_CACHE.set(c.id, { text: c.text, n });
  return n;
}
function findRange(text, passage, getNorm) {
  if (!passage || !passage.trim()) return null;
  const i = text.indexOf(passage);
  if (i >= 0) return [i, i + passage.length];
  // tolère accents, ponctuation, majuscules, espaces, retours à la ligne et coupures de mots (PDF)
  const nt = getNorm ? getNorm() : normalize(text);
  const np = normalize(passage).norm;
  if (np.length < 8) return null;
  const toRange = (s, e) => {
    let end = nt.map[e - 1] + 1;
    while (end < text.length && /[.,;:!?)\]»"'%°]/.test(text[end])) end++; // garde la ponctuation finale
    return [nt.map[s], end];
  };
  const j = nt.norm.indexOf(np);
  if (j >= 0) return toRange(j, j + np.length);
  // dernier recours : le début du passage est retrouvé (le modèle a légèrement modifié la suite)
  const k = Math.min(60, Math.floor(np.length / 2));
  if (k < 20) return null;
  const s = nt.norm.indexOf(np.slice(0, k));
  if (s < 0) return null;
  const e = nt.norm.indexOf(np.slice(-k), s + k);
  if (e >= 0 && e + k - s <= np.length * 1.5) return toRange(s, e + k);
  return toRange(s, Math.min(s + np.length, nt.norm.length)); // longueur approximative
}
function highlightHtml(c) {
  const text = c.text;
  const ranges = [];
  c.questions.forEach(q => {
    if (q.status !== "correct" && q.status !== "wrong") return;
    const r = findRange(text, q.passage, () => normFor(c));
    if (r) ranges.push({ s: r[0], e: r[1], cls: q.status === "correct" ? "ok" : "ko", title: q.question });
  });
  ranges.sort((a, b) => a.s - b.s);
  let out = "", pos = 0;
  for (const r of ranges) {
    if (r.s < pos) continue; // chevauchement : on garde le premier
    out += esc(text.slice(pos, r.s)) + `<mark class="${r.cls}" title="${esc(r.title)}">` + esc(text.slice(r.s, r.e)) + `</mark>`;
    pos = r.e;
  }
  return out + esc(text.slice(pos));
}

// ================= Intelligence artificielle (clé API saisie par l'utilisatrice) =================
async function callClaude(prompt, maxTokens) {
  const { apiKey } = getSettings();
  if (!apiKey) throw new Error("pas de clé API (Réglages)");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, messages: [{ role: "user", content: prompt }] })
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message || ""; } catch {}
    const why = { 400: "requête refusée", 401: "clé API invalide", 403: "accès refusé", 404: "modèle introuvable", 429: "trop de requêtes ou crédit épuisé, réessaie plus tard", 500: "erreur du serveur Anthropic", 529: "serveurs Anthropic surchargés, réessaie plus tard" }[res.status] || "erreur";
    throw new Error(`${why} (code ${res.status}${detail ? " : " + detail : ""})`);
  }
  const data = await res.json();
  return (data.content || []).map(b => b.text || "").join("");
}
// Lit le JSON renvoyé par le modèle, même entouré de texte ou de ```json.
// Si un tableau est coupé (réponse trop longue), on garde les objets complets.
function extractJson(txt) {
  const i = txt.search(/[\[{]/);
  if (i < 0) throw new Error("réponse illisible");
  const close = txt[i] === "[" ? "]" : "}";
  const body = txt.slice(i, txt.lastIndexOf(close) + 1);
  try { return JSON.parse(body); }
  catch (e) {
    if (txt[i] !== "[") throw new Error("réponse illisible");
    const cut = txt.slice(i, txt.lastIndexOf("}") + 1);
    try { return JSON.parse(cut + "]"); } catch { throw new Error("réponse illisible"); }
  }
}
function chunkText(text, size = 12000) {
  const paras = text.split(/\n\s*\n/);
  const out = [];
  let cur = "";
  for (const p of paras) {
    if (cur && cur.length + p.length > size) { out.push(cur); cur = ""; }
    if (p.length > size) { for (let i = 0; i < p.length; i += size) out.push(p.slice(i, i + size)); continue; }
    cur += (cur ? "\n\n" : "") + p;
  }
  if (cur.trim()) out.push(cur);
  return out;
}
function genPrompt(c, chunk, n, already) {
  const d = domOf(c.domain);
  return `Tu es examinatrice pour un examen de kinésithérapie (domaine : ${d ? d.name : ""} ; sous-catégorie : ${c.sub}).
${c.kind === "cas" ? "Il s'agit d'un cas clinique : pose des questions sur le raisonnement clinique (hypothèses, bilan et tests à réaliser, interprétation, objectifs, plan de traitement et exercices adaptés au patient).\n" : ""}À partir du texte ci-dessous, rédige ${n} questions ouvertes pointues : mécanismes, critères, tests et leur interprétation, anatomie précise (muscles, nerfs, os, ligaments, vaisseaux), biomécanique, objectifs et plan de traitement, selon ce que le texte contient. Pas de questions triviales.
Pour chaque question :
- "question" : la question, précise, en français ;
- "passage" : la phrase ou les deux phrases du texte sur lesquelles porte la question, COPIÉES MOT POUR MOT depuis le texte, sans aucune modification ;
- "reponse" : la réponse attendue, exacte et concise.
Réponds uniquement avec un tableau JSON valide, sans texte autour, au format : [{"question": "...", "passage": "...", "reponse": "..."}]
${already.length ? `\nCes questions existent déjà : n'en pose pas de semblables.\n${already.map(q => "- " + q).join("\n")}\n` : ""}
TEXTE :
<<<
${chunk}
>>>`;
}
function gradePrompt(q, draft) {
  return `Tu corriges une réponse à un examen de kinésithérapie.
Question : ${q.question}
Réponse attendue : ${q.reponse}
Réponse de l'étudiante : ${draft}

Juge si la réponse est correcte sur le fond. La formulation peut différer, mais la réponse ne doit contenir aucune erreur et ne doit omettre aucun élément essentiel.
Réponds uniquement avec un objet JSON valide : {"correct": true ou false, "commentaire": "explication brève en français, 1 à 3 phrases"}`;
}

// ================= Actions =================
const ACT = {
  toggleRead(el) {
    const c = getCourse(el.dataset.id);
    c.read = !c.read;
    return DB.put(c);
  },
  toggleAddQ() {
    document.getElementById("addQ").classList.toggle("hidden");
    return false;
  },
  async delCourse(el) {
    const c = getCourse(el.dataset.id);
    const what = c.kind === "cas" ? "ce cas clinique" : "ce cours";
    if (!confirm(`Supprimer ${what} « ${c.title} » et toutes ses questions ? C'est définitif (sauf si tu as un export).`)) return false;
    await DB.del(c.id);
    COURSES = COURSES.filter(x => x.id !== c.id);
    const target = "#/d/" + c.domain;
    flash(`« ${c.title} » supprimé.`, target);
    if (location.hash === target) return true;
    location.hash = target;
    return false;
  },
  async resetQ(el) {
    const c = getCourse(el.dataset.id);
    if (!confirm("Remettre toutes les questions à « non interrogée » ? Les questions sont gardées, seuls les résultats (juste / faux / passée) et le surlignage sont effacés.")) return false;
    c.questions.forEach(q => { q.status = null; q.answer = ""; q.comment = ""; });
    await DB.put(c);
    flash("Résultats remis à zéro.");
    return true;
  },
  async clearQ(el) {
    const c = getCourse(el.dataset.id);
    if (!confirm(`Supprimer les ${c.questions.length} questions de ce cours ? C'est définitif.`)) return false;
    c.questions = [];
    await DB.put(c);
    flash("Toutes les questions ont été supprimées.");
    return true;
  },
  async delQ(el) {
    const c = getCourse(el.dataset.id);
    if (!confirm("Supprimer cette question ?")) return false;
    c.questions = c.questions.filter(q => q.id !== el.dataset.q);
    await DB.put(c);
    return true;
  },
  async generate(el) {
    if (BUSY) return false;
    const c = getCourse(el.dataset.id);
    const { target = 100 } = getSettings();
    const missing = target - c.questions.length;
    if (missing <= 0) { flash(`Ce cours a déjà ${c.questions.length} questions (objectif : ${target}). Change l'objectif dans les Réglages pour en générer plus.`); return true; }
    const chunks = chunkText(c.text);
    // au plus 13 appels d'environ 8 questions, répartis sur tout le texte
    const calls = Math.min(13, Math.ceil(missing / 8));
    const per = Math.ceil(missing / calls);
    const picks = [];
    for (let k = 0; k < calls; k++) {
      picks.push(chunks.length <= calls ? k % chunks.length : (calls === 1 ? 0 : Math.round(k * (chunks.length - 1) / (calls - 1))));
    }
    BUSY = true;
    el.disabled = true;
    let added = 0, found = 0, errors = [];
    try {
      for (let k = 0; k < calls; k++) {
        setMsg("genMsg", `Génération ${k + 1}/${calls}… (${added} question(s) ajoutée(s)). Reste sur cette page.`);
        const chunk = chunks[picks[k]];
        const already = c.questions.filter(q => q.passage && chunk.includes(q.passage)).map(q => q.question).slice(-40);
        try {
          const arr = extractJson(await callClaude(genPrompt(c, chunk, Math.min(per, missing - added), already), 8000));
          (Array.isArray(arr) ? arr : []).forEach(x => {
            if (x && x.question && c.questions.length < target) {
              const q = { id: uid(), question: String(x.question).trim(), passage: String(x.passage || "").trim(), reponse: String(x.reponse || "").trim(), source: "ai", status: null, answer: "", comment: "" };
              c.questions.push(q);
              added++;
              if (findRange(c.text, q.passage, () => normFor(c))) found++;
            }
          });
          await DB.put(c); // on enregistre au fur et à mesure
        } catch (e) {
          errors.push(e.message);
          if (/clé API invalide|crédit|introuvable|accès refusé/.test(e.message)) break; // inutile d'insister
        }
        if (c.questions.length >= target) break;
      }
    } finally { BUSY = false; }
    let msg = `${added} question(s) ajoutée(s)`;
    if (added) msg += `, passage retrouvé dans le texte pour ${found}/${added}`;
    msg += ".";
    if (errors.length) msg += ` ${errors.length} appel(s) en erreur : ${[...new Set(errors)].join(" ; ")}`;
    flash(msg, "#/c/" + c.id);
    return true;
  },
  async saveSettings() {
    const s = getSettings();
    s.apiKey = $("#sKey").value.trim();
    s.target = Number($("#sTarget").value) || 100;
    lsSet(SET_KEY, s);
    flash("Réglages enregistrés.");
    return true;
  },
  exportAll() {
    const data = { version: 2, exportedAt: new Date().toISOString(), courses: COURSES, steps: STEPS_DONE };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = `revision-kine-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const s = getSettings();
    s.lastExport = Date.now();
    lsSet(SET_KEY, s);
    flash("Sauvegarde téléchargée (dossier Téléchargements).");
    return true;
  },
  importAll() {
    document.getElementById("importFile").click();
    return false;
  },
  tab(el) {
    TABS[el.dataset.key] = el.dataset.kind;
  },
  // ----- interrogation -----
  qReveal() {
    QZ.draft = readDraft(); QZ.phase = "reveal"; QZ.result = null; QZ.commentIA = ""; QZ.error = "";
  },
  qSkip() {
    QZ.draft = readDraft(); qRecord("skipped"); QZ.phase = "reveal";
  },
  async qValidate() {
    const draft = readDraft();
    const { c, q } = curQ();
    if (!draft) { QZ.error = "Écris une réponse d'abord, ou clique sur « Voir la réponse »."; return; }
    QZ.draft = draft; QZ.error = "Correction en cours…";
    render();
    try {
      const j = extractJson(await callClaude(gradePrompt(q, draft), 500));
      QZ.commentIA = String(j.commentaire || "");
      QZ.error = "";
      QZ.phase = "reveal";
      if (typeof j.correct !== "boolean" && j.correct !== "true" && j.correct !== "false") throw new Error("réponse illisible");
      qRecord(j.correct === true || j.correct === "true" ? "correct" : "wrong");
    } catch (e) {
      QZ.error = "Correction impossible (" + e.message + "). Réessaie, ou clique sur « Voir la réponse » et note-toi.";
      QZ.phase = "ask";
    }
  },
  qSetOk() { qRecord("correct"); },
  qSetKo() { qRecord("wrong"); },
  qNext() {
    if (!QZ.result) qRecord("skipped");
    QZ.pos++; QZ.phase = "ask"; QZ.draft = ""; QZ.result = null; QZ.commentIA = ""; QZ.error = "";
  }
};

function readDraft() { const el = document.getElementById("ans"); return el ? el.value.trim() : QZ.draft; }
function curQ() {
  const c = getCourse(QZ.courseId);
  return { c, q: c.questions.find(x => x.id === QZ.order[QZ.pos]) };
}
function qRecord(status) {
  const { c, q } = curQ();
  if (!q) return;
  q.status = status;
  q.answer = QZ.draft;
  q.comment = QZ.commentIA || "";
  QZ.result = status;
  QZ.stats[{ correct: "ok", wrong: "ko", skipped: "sk" }[status]]++;
  DB.put(c);
}
function initQuiz(c, mode) {
  // « new » : d'abord les questions jamais posées, puis celles passées ; « err » : celles ratées
  const ids = st => c.questions.filter(q => (q.status || null) === st).map(q => q.id);
  const order = mode === "err" ? ids("wrong") : [...ids(null), ...ids("skipped")];
  QZ = { courseId: c.id, mode, order, pos: 0, phase: "ask", draft: "", result: null, commentIA: "", error: "", stats: { ok: 0, ko: 0, sk: 0 } };
}

// pdf.js 3.11.174 et mammoth 1.6.0 sont copiés dans le dossier de l'application (fonctionne hors ligne)
const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = src;
  s.onload = res;
  s.onerror = () => rej(new Error("chargement impossible"));
  document.head.appendChild(s);
});
let PDFJS = null;
async function loadPdfJs() {
  if (PDFJS) return PDFJS;
  try { await loadScript("pdf.min.js"); } catch { throw new Error("lecteur de PDF introuvable"); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  return (PDFJS = window.pdfjsLib);
}
let MAMMOTH = null;
async function loadMammoth() {
  if (MAMMOTH) return MAMMOTH;
  try { await loadScript("mammoth.browser.min.js"); } catch { throw new Error("lecteur de fichiers Word introuvable"); }
  return (MAMMOTH = window.mammoth);
}
async function readFileText(f, onPage) {
  if (/\.docx$/i.test(f.name)) {
    const lib = await loadMammoth();
    const r = await lib.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return r.value;
  }
  if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      if (onPage) onPage(p, pdf.numPages);
      const content = await (await pdf.getPage(p)).getTextContent();
      pages.push(content.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("").replace(/[ \t]{2,}/g, " "));
    }
    return pages.join("\n\n");
  }
  const buf = await f.arrayBuffer();
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch { return new TextDecoder("windows-1252").decode(buf); } // fichiers .txt encodés en ANSI
}
async function importFiles(files, domId, sub, kind) {
  if (!domId) { // bouton de la page « nouveau cours » : on lit la catégorie choisie
    const [d, ...rest] = (document.querySelector('select[name="sub"]')?.value || "").split("|");
    domId = d; sub = rest.join("|");
    kind = kind || document.querySelector('select[name="kind"]')?.value || "cours";
  }
  const allowed = /\.(txt|md|pdf|docx)$/i;
  const created = [], errors = [];
  for (const f of files) {
    if (!allowed.test(f.name)) { errors.push(`${f.name} : format non pris en charge${/\.doc$/i.test(f.name) ? " (enregistre-le en .docx)" : ""}`); continue; }
    try {
      const text = (await readFileText(f, (p, n) => setMsg("genMsg", `${f.name} : page ${p}/${n}…`))).trim();
      if (!text) throw new Error("aucun texte trouvé (PDF scanné ?)");
      const c = { id: uid(), kind: kind === "cas" ? "cas" : "cours", domain: domId, sub, title: f.name.replace(allowed, ""), text, read: false, questions: [], createdAt: Date.now() };
      await DB.put(c);
      COURSES.push(c);
      created.push(c);
    } catch (e) { errors.push(`${f.name} : ${e.message}`); }
  }
  let text = `${created.length} fichier(s) importé(s).`;
  if (errors.length) text += " Erreurs : " + errors.join(" ; ");
  const target = created.length === 1 && !errors.length ? "#/c/" + created[0].id : "#/d/" + domId;
  if (created.length) TABS[domId + "|" + sub] = created[0].kind; // affiche l'onglet où les fichiers sont arrivés
  flash(text, target);
  if (location.hash === target) render(); else location.hash = target;
}

// ================= Routeur et rendu =================
function render() {
  const p = routeParts();
  let html, title = "Révision Kiné";
  try {
    if (!p[0]) html = viewHome();
    else if (p[0] === "d") { const d = domOf(p[1]); if (d) { title = d.name; html = viewDomain(d); } else html = notFound(); }
    else if (p[0] === "c") { const c = getCourse(p[1]); if (c) { title = c.title; html = viewCourse(c); } else html = notFound(); }
    else if (p[0] === "q") {
      const c = getCourse(p[1]);
      if (c) { if (!QZ || QZ.courseId !== c.id || QZ.mode !== (p[2] || "new")) initQuiz(c, p[2] || "new"); title = "Interrogation"; html = viewQuiz(c); }
      else html = notFound();
    }
    else if (p[0] === "nouveau") { title = "Nouveau cours"; html = viewNew(p[1], p[2], p[3]); }
    else if (p[0] === "reglages") { title = "Réglages"; html = viewSettings(); }
    else html = notFound();
  } catch (e) { html = `<section class="card err">Erreur : ${esc(e.message)}</section>`; }
  $("#app").innerHTML = html;
  $("#title").textContent = title;
  if (p[0] === "reglages") showStorage();
}
async function showStorage() {
  const el = document.getElementById("storageInfo");
  if (!el) return;
  let txt = "";
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const { usage = 0, quota = 0 } = await navigator.storage.estimate();
      const num = v => v.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
      txt += `Espace utilisé : ${num(usage / 1048576)} Mo sur ${num(quota / 1073741824)} Go disponibles. `;
    }
    if (navigator.storage && navigator.storage.persisted) {
      txt += (await navigator.storage.persisted())
        ? "Stockage protégé : le téléphone ne l'effacera pas pour libérer de la place."
        : "Stockage non protégé : installe l'application sur l'écran d'accueil pour que le téléphone ne l'efface pas.";
    }
  } catch {}
  el.textContent = txt || "Informations indisponibles sur ce navigateur.";
}
function setMsg(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

// ================= Événements =================
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el))
    .then(r => { if (r !== false) render(); })
    .catch(err => alert("Erreur : " + err.message));
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.step) {
    STEPS_DONE[t.dataset.step] = t.checked;
    lsSet(STEP_KEY, STEPS_DONE);
  } else if (t.dataset && t.dataset.know) {
    const c = getCourse(t.dataset.know);
    c.knowledge = Number(t.value);
    await DB.put(c);
    render();
  } else if (t.dataset && t.dataset.upload) {
    const files = [...t.files];
    t.value = "";
    await importFiles(files, t.dataset.domain, t.dataset.sub, t.dataset.kind);
  } else if (t.id === "importFile") {
    const f = t.files[0];
    if (!f) return;
    t.value = "";
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.courses)) throw new Error("format inconnu");
      const list = data.courses.filter(c => c && c.id && typeof c.text === "string").map(c => ({
        ...c,
        kind: c.kind === "cas" ? "cas" : "cours",
        questions: Array.isArray(c.questions) ? c.questions : [],
        knowledge: c.knowledge ?? null
      }));
      const same = list.filter(c => getCourse(c.id)).length;
      if (!confirm(`Restaurer ${list.length} cours depuis cette sauvegarde ?\n` +
        (same ? `${same} cours déjà présent(s) seront remplacés par la version de la sauvegarde. ` : "") +
        "Les cours absents de la sauvegarde sont conservés. Les cases à cocher des étapes seront celles de la sauvegarde.")) return;
      await DB.putMany(list);
      COURSES = await DB.all();
      if (data.steps && typeof data.steps === "object") { STEPS_DONE = data.steps; lsSet(STEP_KEY, STEPS_DONE); }
      flash(`Restauration réussie : ${list.length} cours.`);
    } catch (err) { flash("Fichier invalide : " + err.message); }
    render();
  }
});

document.addEventListener("submit", async e => {
  const f = e.target;
  e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === "addQ") {
    const c = getCourse(f.dataset.id);
    const question = String(fd.get("question") || "").trim();
    if (!question) return;
    c.questions.push({ id: uid(), question, passage: String(fd.get("passage") || "").trim(), reponse: String(fd.get("reponse") || "").trim(), source: "manual", status: null, answer: "", comment: "" });
    await DB.put(c);
    render();
  } else if (f.dataset.form === "newCourse") {
    const [domain, ...rest] = String(fd.get("sub") || "").split("|");
    const sub = rest.join("|");
    const c = { id: uid(), kind: String(fd.get("kind")) === "cas" ? "cas" : "cours", domain, sub, title: String(fd.get("title") || "").trim() || "Sans titre", text: String(fd.get("text") || "").trim(), read: false, questions: [], createdAt: Date.now() };
    COURSES.push(c);
    await DB.put(c);
    location.hash = "#/c/" + c.id;
  }
});

window.addEventListener("hashchange", () => {
  const p = routeParts();
  if (p[0] === "q") { const c = getCourse(p[1]); if (c) initQuiz(c, p[2] || "new"); }
  render();
});

(async () => {
  try { COURSES = (await DB.all()) || []; }
  catch (e) { alert("Stockage indisponible : " + e.message); }
  render();
  // demande au navigateur de ne pas effacer les données (accordé en général une fois l'appli installée)
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
